<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó de colores</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="marco-madera">

        <header class="cabecera">

            <h1>Dominó de colores</h1>

        </header>


        <main>

            <div class="zona-juego">

                <section class="maquina">

                    <h2>Máquina</h2>

                    <div class="fichas-maquina">

                        <!-- Las fichas de la máquina se crearán con JavaScript -->

                    </div>
                    </section>

                <div class="zona-central">
                    <div class="zona-fichas">
                        <section class="zona-pozo panel-cristal">
                            <h2>Pozo</h2>
                            <div class="fichas-pozo">

                            </div>
                        </section>
                        <section class="zona-jugador">
                            <h2>Zona del jugador</h2>
                            <div class="fichas-jugador">

                            </div>
                            </section>
                            </div>

                            <div class="tablero-controles">
                                <section class="tablero-central">
                                    <h2></h2>
                                    <div class="cadena-fichas">

                                    </div>
                                </section>
                                <section class="controles panel-cristal">
                                    <h2>Controles</h2>
                                    <div class="controles-botones">
                                        <button type="button" id="btn-izquierda">
                                            <span class="boton-icono">&#8592;</span>
                                            Izquierda
                                        </button>
                                        <button type="button" id="btn-derecha">
                                            <span class="boton-icono">&#8594;</span>
                                            Derecha
                                        </button>
                                        <button type="button" id="btn-robar">
                                            <span class="boton-icono">&#8635;</span>
                                            Robar
                                        </button>
                                        <button type="button" id="btn-pasar">
                                            <span class="boton-icono">&#10005;</span>
                                            Pasar
                                        </button>
                                        <button
                                        type="button"
                                        id="btn-nueva-partida"
                                        class="boton-principal"
                                        >
                                        <span class="boton-icono">&#10003;</span>
                                        Nueva partida
                                    </button>

                                    </div>
                                </section>
                            </div>

                    </div>
                </div>

</body>






</html>
